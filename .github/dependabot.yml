version: 2

updates:
  # The workflows pin every action to a commit SHA, so they never update on their own. This keeps the SHAs fresh.
  # Commits and PR titles start with `ci:` so release-please does not count them as a release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Gradle is left out on purpose. A bump there needs gradle/verification-metadata.xml regenerated on a clean
  # cache (see tasks/todo.md), which Dependabot cannot do, so its pull requests would only fail CI. The app has
  # no runtime dependencies besides its own core module; build tooling is upgraded by hand.
