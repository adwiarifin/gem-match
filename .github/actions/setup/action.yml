name: Set up the build
description: JDK 21, Gradle, Android licenses and the pinned gitleaks and osv-scanner that make check-full run.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "21"

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        validate-wrappers: true

    - name: Accept Android SDK licenses
      shell: bash
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

    # Binaries are pinned by version and checked against a SHA-256 written here, not downloaded alongside.
    - name: Install gitleaks and osv-scanner
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/bin"
        curl -sSfL -o gitleaks.tar.gz \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz -C "$HOME/bin" gitleaks
        curl -sSfL -o "$HOME/bin/osv-scanner" \
          https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
        echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $HOME/bin/osv-scanner" | sha256sum -c -
        chmod +x "$HOME/bin/osv-scanner"
        rm gitleaks.tar.gz
        echo "$HOME/bin" >>"$GITHUB_PATH"
