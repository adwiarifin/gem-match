name: Release

# Every push to main updates the release PR. Merging that PR tags the release, then three jobs run:
#   build    checks and builds the unsigned APK. It has no secrets and a read-only token.
#   sign     waits for the owner's approval, then signs that exact APK. It runs no build code.
#   publish  attaches the signed APK to the release. It has the write token and no secrets.
# They are all in this file because a tag made with the default token would not start a separate workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      apk_sha256: ${{ steps.hash.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0 # the whole history and every tag: gitleaks and the floor guard need them
          persist-credentials: false

      - name: Check the tag points at the release commit
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          EXPECTED_SHA: ${{ needs.release-please.outputs.sha }}
        run: test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_SHA"

      - uses: ./.github/actions/setup

      # The floor guard runs against everything since the previous release (or the first commit, for the first one).
      - name: Check and build
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          base=$(git describe --tags --abbrev=0 "${EXPECTED_SHA}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          make release-check BASE="$base"

      - id: hash
        run: echo "apk_sha256=$(sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sign:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The signing secrets live in this environment, which requires the owner's approval before the job starts.
    # By then `build` is green, and its APK hash is in the run summary to compare.
    environment: release
    concurrency:
      group: release-sign
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Only for scripts/sign-ci.sh. No Gradle, no make, no setup action: the only repo code that sees the key is that script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release

      - name: Sign
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.sha }}
          EXPECTED_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          VERSION: ${{ needs.release-please.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: gemmatch
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$KEYSTORE_PATH"
          scripts/sign-ci.sh "$VERSION" "$RUNNER_TEMP/signed"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: ${{ runner.temp }}/signed
          if-no-files-found: error

  publish:
    needs: [release-please, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: signed

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" signed/*.apk signed/*.sha256 --repo "$GITHUB_REPOSITORY"
