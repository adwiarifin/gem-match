[versions]
agp = "9.4.1"
kotlin = "2.4.21"
kover = "0.9.11"
ktlintPlugin = "14.2.0"
detekt = "1.23.8"

[libraries]
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
